name: Build Lens Launcher APK

on:
  push:
    branches: [lens-launcher]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK (licenses and platform)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; then
            msg=$(grep -E "^e: |error:|FAILED|What went wrong|Caused by|Could not|not found|Execution failed|^> " -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=GradleFailure::${msg}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LensLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LensShortcut.apk
          gh release delete lens-launcher-latest --yes --cleanup-tag || true
          gh release create lens-launcher-latest LensShortcut.apk \
            --target "${{ github.sha }}" \
            --title "Lens Shortcut APK" \
            --notes "Debug APK built from commit ${{ github.sha }}. Download LensShortcut.apk and install."
