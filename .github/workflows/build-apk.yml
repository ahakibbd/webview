name: Build APK

on:
  push:
    branches: [apk-scanner]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK (licenses and platform)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check language data is inside the APK
        run: |
          ls -la app/src/main/assets/tessdata/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "traineddata|libtesseract|libjpeg" || true

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineScanner-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OfflineScanner.apk
          gh release delete offline-scanner-latest --yes --cleanup-tag || true
          gh release create offline-scanner-latest OfflineScanner.apk \
            --target "${{ github.sha }}" \
            --title "Offline Scanner APK" \
            --notes "Debug APK built from commit ${{ github.sha }}. Download OfflineScanner.apk and install."
